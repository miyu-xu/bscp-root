
[package]
name = "virtmgr"
version = "0.1.0"
edition = "2021"
authors = ["Android Virtualization Team"]
description = "Android Virtualization Manager"
license = "Apache-2.0"

[[bin]]
name = "virtmgr"
path = "src/main.rs"

[dependencies]
hw_timeout_multiplier = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/hw_timeout_multiplier" }
anyhow = "1.0"
clap = { version = "=4.5.32", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-xml-rs = "0.6"
log = "0.4"
env_logger = "0.10"
android_logger = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/android_logger" }
hex = "0.4"
regex = "1.0"
uuid = { version = "=1.12.1", features = ["v4"] }
glob = "0.3"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
once_cell = "1.0"
cfg-if = "1.0"
libc = "0.2"
semver = "1.0"
cstr = "0.2"
zerocopy = { version = "0.8", features = ["derive"] }
fsfdt = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/fsfdt" }
libfdt = { path = "/Volumes/Mark SSD/aosp17-virtmgr-libfdt-v1/wrapper" }

hypervisor_props = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/hypervisor_props" }
nested_virt = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/nested_virt" }
microdroid_metadata = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/microdroid_metadata" }
selinux_bindgen = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/selinux_bindgen" }

apkverify = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/apkverify" }
avflog = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/avflog" }
microdroid_payload_config = { path = "/Volumes/Mark SSD/aosp17-virtmgr-closure-v1" }
rustutils = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/rustutils" }
vbmeta = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/vbmeta" }
vmconfig = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/vmconfig" }
packagemanager_aidl = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/packagemanager_aidl" }
android_os_permissions_aidl = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/android_os_permissions_aidl" }
statslog_virtualization_rust = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/statslog_virtualization_rust" }
tombstoned_client = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/tombstoned_client" }
disk = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/disk" }
crosvm_control = { path = "/Volumes/Mark SSD/aosp17-host-port-v1/crosvm/crosvm_control", features = ["hvf"] }
scopeguard = "1"

# Relative to this crate (packages/modules/Virtualization/android/virtmgr) → repo root → frameworks/...
binder = { package = "android-binder", path = "/Volumes/Mark SSD/aosp17-binder-rust-host-v1" }
rpcbinder = { path = "/Volumes/Mark SSD/aosp17-binder-rust-host-v1/rpcbinder" }

android_system_virtualizationcommon = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/android_system_virtualizationcommon" }
android_system_virtualizationservice = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/android_system_virtualizationservice" }
android_system_virtualizationservice_internal = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/android_system_virtualizationservice_internal" }
android_system_virtualmachineservice = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/android_system_virtualmachineservice" }
android_system_virtualizationmaintenance = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/android_system_virtualizationmaintenance" }
android_hardware_security_secretkeeper = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/android_hardware_security_secretkeeper" }
android_hardware_security_authgraph = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/android_hardware_security_authgraph" }
avf_features = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/avf_features" }
desktop_host = { path = "/Volumes/Mark SSD/aosp17-virtmgr-formal-v1/Virtualization/libs/desktop_host" }

rpc_servicemanager_aidl = { path = "/Volumes/Mark SSD/aosp17-host-bridge-v638/facades/rpc_servicemanager_aidl" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["fs", "process", "signal", "socket", "user"] }
command-fds = "=0.3.0"
shared_child = "1.0"

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
vsock = "0.5"

[target.'cfg(windows)'.dependencies]
shared_child = "1.0"
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[patch.crates-io]
audio_streams = { path = "/Volumes/Mark SSD/aosp17-host-port-v1/crosvm/common/audio_streams" }
libcras = { path = "/Volumes/Mark SSD/aosp17-host-port-v1/crosvm/libcras_stub" }
minijail = { path = "/Volumes/Mark SSD/aosp17-host-port-v1/crosvm/third_party/minijail/rust/minijail" }

[dev-dependencies]
tempfile = "=3.14.0"

[features]
desktop-gpu = []
