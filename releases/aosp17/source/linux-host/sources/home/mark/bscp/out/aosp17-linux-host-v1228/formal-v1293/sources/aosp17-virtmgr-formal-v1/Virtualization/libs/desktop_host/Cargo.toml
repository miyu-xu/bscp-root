[package]
name = "desktop_host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Platform abstraction traits and implementations for AVF desktop host runtimes"

[lib]
name = "desktop_host"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
log = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
binder = { package = "android-binder", path = "/home/mark/bscp/out/aosp17-linux-host-v1228/formal-v1293/sources/aosp17-binder-rust-host-v1" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["fs", "process"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
vsock = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
] }
