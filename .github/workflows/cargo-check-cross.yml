name: Cross-platform Cargo check

on:
  push:
    branches: [main, 'bscp-*']
  pull_request:
    branches: [main]

jobs:
  cargo-check-linux:
    name: cargo check (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cargo check virtmgr
        run: cargo check --manifest-path packages/modules/Virtualization/android/virtmgr/Cargo.toml --target x86_64-unknown-linux-gnu

  cargo-check-macos:
    name: cargo check (macOS aarch64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compilation target
        run: rustup target add aarch64-apple-darwin
      - name: cargo check virtmgr
        run: cargo check --manifest-path packages/modules/Virtualization/android/virtmgr/Cargo.toml --target aarch64-apple-darwin

  cargo-check-windows:
    name: cargo check (Windows x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compilation target
        run: rustup target add x86_64-pc-windows-gnu
      - name: cargo check virtmgr
        run: cargo check --manifest-path packages/modules/Virtualization/android/virtmgr/Cargo.toml --target x86_64-pc-windows-gnu
