name: Symbol export check

on:
  push:
    branches: [main, 'bscp-*']
  pull_request:
    branches: [main]

jobs:
  symbol-check-linux:
    name: Symbol check (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build binutils
      - name: Build with testing
        run: chmod +x build_all.sh && ./build_all.sh
      - name: Build test targets
        run: |
          cd out/build && cmake -DBUILD_TESTING=ON ../.. && cmake --build . --target rpc_smoke_test --target binder-rpc
      - name: Run symbol check
        run: bash frameworks/native/libs/binder/tests/host/check_symbols.sh out/build/lib/libbinder-rpc.so

  symbol-check-macos:
    name: Symbol check (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build with testing
        run: chmod +x build_all.sh && ./build_all.sh
      - name: Build test targets
        run: |
          cd out/build && cmake -DBUILD_TESTING=ON ../.. && cmake --build . --target rpc_smoke_test --target binder-rpc
      - name: Run symbol check
        run: bash frameworks/native/libs/binder/tests/host/check_symbols.sh out/build/lib/libbinder-rpc.1.0.0.dylib
      - name: Run RPC smoke test
        run: cd out/build && ctest -R rpc_smoke_test --output-on-failure
