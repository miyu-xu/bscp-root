name: Build

on:
  push:
    branches: [main, 'bscp-*']
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y cmake ninja-build
      - name: Build all
        run: chmod +x build_all.sh && ./build_all.sh
      - name: Verify artifacts
        run: chmod +x scripts/verify_build.sh && scripts/verify_build.sh

  build-macos:
    name: Build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app || true
      - name: Build all
        run: chmod +x build_all.sh && ./build_all.sh
      - name: Verify artifacts
        run: chmod +x scripts/verify_build.sh && scripts/verify_build.sh

  build-windows:
    name: Build (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Build all
        run: .\build_all.bat
      - name: Verify artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path out\dist\windows\bin\virtmgr.exe)) { throw "virtmgr.exe not found" }
          if (-not (Test-Path out\dist\windows\bin\vm.exe)) { throw "vm.exe not found" }
          if (-not (Test-Path out\dist\windows\bin\crosvm.exe)) { throw "crosvm.exe not found" }
          if (-not (Test-Path out\dist\windows\lib\libbinder-rpc.dll)) { throw "libbinder-rpc.dll not found" }
          Write-Host "All Windows artifacts present"
